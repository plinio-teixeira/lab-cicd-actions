
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site - Versão 3 — corrigida</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: #000080;
      padding: 1rem;
      box-sizing: border-box;
    }

    .cartao {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
      text-align: center;
      color: #000080;
    }

    .emoji {
      font-size: 4rem;
    }

    h1 {
      margin: .5rem 0;
      color: #1e9e5a;
    }

    .versao {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      background: #f2f2f7;
      text-align: left;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    code {
      background: #e5e5ea;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .campo {
      margin-top: 1rem;
      text-align: left;
    }

    .campo label {
      display: block;
      margin-bottom: .4rem;
      font-weight: 600;
      color: #000080;
    }

    .campo input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #c7c7cc;
      border-radius: 8px;
      font: inherit;
      color: #222;
      background: #fff;
    }

    .campo input:focus {
      outline: 2px solid #1e9e5a;
      border-color: #1e9e5a;
    }

    .botao-email {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #1e9e5a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: .2s;
    }

    .botao-email:hover {
      background: #187d48;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e5ea;
      color: #6e6e73;
      font-size: .85rem;
    }

    @media (max-width: 480px) {
      .cartao {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <main class="cartao">

    <div class="emoji">✅</div>

    <h1>Versão 3 — corrigida</h1>

    <p><b>O problema foi resolvido!</b></p>

    <!-- Campos preenchidos pelo usuário -->
    <div class="campo">
      <label for="nome">Seu nome:</label>
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome completo"
        autocomplete="name"
        required
      >
    </div>

    <div class="campo">
      <label for="data">Data da publicação:</label>
      <input
        type="date"
        id="data"
        name="data"
        required
      >
    </div>

    <!-- Informações da publicação -->
    <div class="versao">
      🤖 <strong>Publicado por:</strong>
      <span id="nomeExibido">Seu nome aparecerá aqui</span><br>

      📅 <strong>Data:</strong>
      <span id="dataExibida">Selecione uma data</span><br>

      🔖 <strong>Commit:</strong>
      <code>__COMMIT__</code><br>

      👤 <strong>Enviado por:</strong>
      __AUTOR__
    </div>

    <!-- Botão de envio do e-mail -->
    <a
      class="botao-email"
      id="botaoEmail"
      href="#"
    >
      📧 Enviar e-mail
    </a>

    <footer>
      🎓 UNINOVE · Automação de Processos · DevOps<br>
      Prof. Marcelino Dias da Silva
    </footer>

  </main>

  <script>
    const campoNome = document.getElementById("nome");
    const campoData = document.getElementById("data");
    const nomeExibido = document.getElementById("nomeExibido");
    const dataExibida = document.getElementById("dataExibida");
    const botaoEmail = document.getElementById("botaoEmail");

    // Preenche a data inicial com a data atual, no horário local.
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, "0");
    const dia = String(hoje.getDate()).padStart(2, "0");

    campoData.value = `${ano}-${mes}-${dia}`;

    function formatarData(data) {
      if (!data) return "";

      const [ano, mes, dia] = data.split("-");
      return `${dia}/${mes}/${ano}`;
    }

    function atualizarInformacoes() {
      const nome = campoNome.value.trim();
      const data = campoData.value;

      nomeExibido.textContent = nome || "Seu nome aparecerá aqui";
      dataExibida.textContent = data
        ? formatarData(data)
        : "Selecione uma data";
    }

    campoNome.addEventListener("input", atualizarInformacoes);
    campoData.addEventListener("change", atualizarInformacoes);

    botaoEmail.addEventListener("click", function(event) {
      event.preventDefault();

      const nome = campoNome.value.trim();
      const data = campoData.value;

      if (!nome) {
        alert("Por favor, digite seu nome antes de enviar o e-mail.");
        campoNome.focus();
        return;
      }

      if (!data) {
        alert("Por favor, selecione a data da publicação.");
        campoData.focus();
        return;
      }

      const dataFormatada = formatarData(data);

      const assunto = "Versão 3 - Site corrigido";

      const corpo =
        "Olá,\n\n" +
        "O site foi publicado com sucesso.\n\n" +
        "Data: " + dataFormatada + "\n" +
        "Commit: __COMMIT__\n" +
        "Autor: __AUTOR__\n" +
        "Publicado por: " + nome;

      const destinatario = "seuemail@exemplo.com";

      const linkEmail =
        "mailto:" + destinatario +
        "?subject=" + encodeURIComponent(assunto) +
        "&body=" + encodeURIComponent(corpo);

      window.location.href = linkEmail;
    });

    atualizarInformacoes();
  </script>

</body>
